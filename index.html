<script>
const SUPABASE_URL='https://fftbbjufazylnlhcnida.supabase.co';
const SUPABASE_KEY='sb_publishable_uuVBiqlBugutdZrFAmWzlA_mV6k8RTR';
const raw=JSON.parse(document.getElementById('data').textContent);

function deviceId(){let k='bb_web_device_id';let v=localStorage.getItem(k);if(!v){v='dev-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem(k,v)}return v}
async function activate(){const code=document.getElementById('code').value.trim().toUpperCase();const msg=document.getElementById('msg');if(!code){msg.innerHTML='<span class="bad">Enter your product code.</span>';return}msg.textContent='Checking...';try{const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/activate_web_license_device',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify({p_code:code,p_device_id:deviceId()})});const d=await r.json();if(!r.ok||!d||d.success===false)throw new Error((d&&d.error)||'Invalid or inactive activation code');const purchased=(d.purchased_chapters||[]).map(Number);const allowed=CHAPTERS.filter(c=>purchased.includes(Number(c.n)));if(!allowed.length)throw new Error('No purchased chapters were found for this code.');document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const box=document.getElementById('chapters');box.innerHTML='';allowed.forEach(c=>{const b=document.createElement('button');b.className='chapter';b.textContent='Chapter '+c.n+' — '+c.title;b.onclick=()=>{document.getElementById('frame').srcdoc=c.html;document.getElementById('lesson').classList.remove('hidden');document.getElementById('app').querySelector('.card').classList.add('hidden')};box.appendChild(b)});}catch(e){msg.innerHTML='<span class="bad">❌ '+e.message+'</span>'}}

document.getElementById('back').onclick=()=>{document.getElementById('lesson').classList.add('hidden');document.getElementById('app').querySelector('.card').classList.remove('hidden')};
